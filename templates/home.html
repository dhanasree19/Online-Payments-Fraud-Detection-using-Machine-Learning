<!DOCTYPE html>

<html>
<head>
    <title>Fraud Detection System</title>


<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#4b6cb7,#182848);
        font-family:Arial, Helvetica, sans-serif;
        color:white;
    }

    .box{
        width:420px;
        padding:35px;
        text-align:center;
        background:white;
        color:black;
        border-radius:12px;
        box-shadow:0px 8px 25px rgba(0,0,0,0.3);
    }

    h2{
        margin-bottom:5px;
    }

    h3{
        color:#555;
        margin-bottom:20px;
    }

    button{
        width:100%;
        padding:12px;
        margin-top:20px;
        font-size:16px;
        background:#4b6cb7;
        color:white;
        border:none;
        border-radius:6px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#182848;
    }
</style>


</head>

<body>

<div class="box">


<h2>Online Payment</h2>
<h3>Fraud Detection System</h3>

<p>Predict fraudulent online transactions using Machine Learning.</p>

<a href="/index">
    <button>Start Prediction</button>
</a>


</div>

</body>
</html>
